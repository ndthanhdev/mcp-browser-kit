approvedGitRepositories:
  - "**"

enableScripts: true

nodeLinker: node-modules

# The etc/docker container shares this checkout's node_modules, so Linux glibc
# binaries are installed next to the host's own.
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
  libc:
    - current
    - glibc

npmMinimalAgeGate: 0

npmPublishRegistry: "https://registry.npmjs.org"

yarnPath: .yarn/releases/yarn-4.17.1.cjs
