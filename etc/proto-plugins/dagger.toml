name = "dagger"
type = "cli"

# Vendored proto plugin for the Dagger CLI.
#
# This was previously sourced from a third-party repository
# (Phault/proto-toml-plugins), which was deleted and began returning 404,
# breaking every CI job at the toolchain-install step. Keeping the schema in
# the repository removes that external point of failure; it only ever pointed
# at Dagger's own GitHub releases anyway.

[platform.linux]
download-file = "dagger_v{version}_linux_{arch}.tar.gz"
checksum-file = "checksums.txt"

[platform.macos]
download-file = "dagger_v{version}_darwin_{arch}.tar.gz"
checksum-file = "checksums.txt"

[platform.windows]
download-file = "dagger_v{version}_windows_{arch}.zip"
checksum-file = "checksums.txt"

[install]
download-url = "https://github.com/dagger/dagger/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/dagger/dagger/releases/download/v{version}/{checksum_file}"

[install.arch]
x86_64 = "amd64"
arm64 = "arm64"
aarch64 = "arm64"

[install.exes.dagger]
primary = true

[resolve]
git-url = "https://github.com/dagger/dagger"
version-pattern = '^v?(\d+\.\d+\.\d+)$'
