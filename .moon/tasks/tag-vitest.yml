$schema: https://moonrepo.dev/schemas/tasks.json
fileGroups:
  vitest-sources:
  - src/**/*
  # vitest configs alias workspace packages to their sources.
  - /packages/*/src/**/*
  vitest-config:
  - vitest.config.ts
tasks:
  # Unit tests for pure logic; browser E2E lives in `playwright-test`.
  vitest-test:
    toolchain: node
    script: |
      vitest run
    inputs:
    - '@group(vitest-sources)'
    - '@group(vitest-config)'
    options:
      outputStyle: stream
  vitest-watch:
    toolchain: node
    preset: server
    script: |
      vitest
inheritedBy:
  tag: vitest
