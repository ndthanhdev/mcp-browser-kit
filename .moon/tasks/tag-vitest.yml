$schema: https://moonrepo.dev/schemas/tasks.json
fileGroups:
  vitest-sources:
  - src/**/*
  vitest-config:
  - vitest.config.ts
tasks:
  # Unit tests for library packages. Kept separate from `playwright-test`
  # (apps/ext-e2e), which drives a real browser + server; this is for pure logic
  # that would otherwise be untestable — token caches, protocol polling loops,
  # response filtering — using a mocked `fetch`.
  vitest-test:
    toolchain: node
    script: |
      vitest run
    inputs:
    - '@group(vitest-sources)'
    - '@group(vitest-config)'
    options:
      outputStyle: stream
  vitest-watch:
    toolchain: node
    preset: server
    script: |
      vitest
inheritedBy:
  tag: vitest
