$schema: https://moonrepo.dev/schemas/tasks.json
fileGroups:
  playwright-tests:
  - tests/**/*
  playwright-configs:
  - playwright.config.ts
  playwright-browsers:
  - $workspaceRoot/.tmp/browsers/**/*
  playwright-workspace-sources:
  - $workspaceRoot/**/src/**/*
tasks:
  playwright-test:
    toolchain: node
    options:
      outputStyle: stream
    env:
      PLAYWRIGHT_BROWSERS_PATH: $workspaceRoot/.tmp/browsers
      NODE_OPTIONS: --require @swc-node/register
      # Playwright's transform parses TypeScript with the TC39 decorators
      # proposal, which rejects the InversifyJS constructor parameter
      # decorators in the workspace sources. The async loader leaves the
      # require hook to @swc-node/register, which honours experimentalDecorators.
      PLAYWRIGHT_FORCE_ASYNC_LOADER: "1"
    script: playwright test
    inputs:
    - '@group(playwright-tests)'
    - '@group(playwright-configs)'
    - '@group(playwright-workspace-sources)'
  playwright-show-report:
    toolchain: node
    preset: server
    script: playwright show-report target/playwright/playwright-report
    inputs:
    - ./target/playwright/playwright-report/**/*
inheritedBy:
  tag: playwright
