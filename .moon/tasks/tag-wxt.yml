$schema: https://moonrepo.dev/schemas/tasks.json
fileGroups:
  wxt-config:
  - wxt.config.ts
  - web-ext.config.ts
  wxt-sources:
  - src/**/*
  - entrypoints/**/*
  wxt-assets:
  - assets/**/*
  - public/**/*
  wxt-prepared:
  - .wxt/**/*
  wxt-output:
  - .output/**/*
  wxt-extension-dist:
  - target/extension/dist/**/*
tasks:
  wxt-install-browser:
    toolchain: node
    preset: utility
    deps:
    - scripts:browser-install
    env:
      PLAYWRIGHT_BROWSERS_PATH: $workspaceRoot/.tmp/browsers
    script: |
      CHROME="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
      FIREFOX="$(node -e "console.log(require('@playwright/test').firefox.executablePath())")"
      printf 'import { defineWebExtConfig } from "wxt";\n\nexport default defineWebExtConfig({\n\tbinaries: {\n\t\tchrome: "%s",\n\t\tfirefox: "%s",\n\t},\n});\n' "$CHROME" "$FIREFOX" > web-ext.config.ts
  wxt-prepare:
    toolchain: node
    script: wxt prepare
    inputs:
    - '@group(wxt-config)'
    - '@group(wxt-sources)'
    outputs:
    - '@group(wxt-prepared)'
  wxt-dev:
    toolchain: node
    preset: server
    script: wxt
    inputs:
    - '@group(wxt-config)'
    - '@group(wxt-sources)'
    - '@group(wxt-assets)'
  wxt-build:
    toolchain: node
    options:
      runDepsInParallel: false
    deps:
    - wxt-prepare
    script: wxt build
    inputs:
    - '@group(wxt-config)'
    - '@group(wxt-sources)'
    - '@group(wxt-assets)'
    outputs:
    - '@group(wxt-output)'
  wxt-zip:
    toolchain: node
    options:
      runDepsInParallel: false
    # Shares the .output directory with wxt-build, so it must not run alongside it
    deps:
    - wxt-build
    script: wxt zip
    inputs:
    - '@group(wxt-config)'
    - '@group(wxt-sources)'
    - '@group(wxt-assets)'
    outputs:
    - '@group(wxt-output)'
  wxt-dev-firefox:
    toolchain: node
    preset: server
    script: wxt -b firefox
    inputs:
    - '@group(wxt-config)'
    - '@group(wxt-sources)'
    - '@group(wxt-assets)'
  wxt-build-firefox:
    toolchain: node
    options:
      runDepsInParallel: false
    deps:
    - wxt-prepare
    script: wxt build -b firefox
    inputs:
    - '@group(wxt-config)'
    - '@group(wxt-sources)'
    - '@group(wxt-assets)'
    outputs:
    - '@group(wxt-output)'
  wxt-zip-firefox:
    toolchain: node
    options:
      runDepsInParallel: false
    # Shares the .output directory with wxt-build-firefox, so it must not run alongside it
    deps:
    - wxt-build-firefox
    script: wxt zip -b firefox
    inputs:
    - '@group(wxt-config)'
    - '@group(wxt-sources)'
    - '@group(wxt-assets)'
    outputs:
    - '@group(wxt-output)'
  wxt-collect-chrome:
    toolchain: node
    options:
      runDepsInParallel: false
    deps:
    - wxt-zip
    script: $workspaceRoot/etc/scripts/moon-tasks/wxt-collect-chrome.ts
    env:
      PROJECT_ROOT: $projectRoot
    inputs:
    - '@group(wxt-config)'
    - '@group(wxt-sources)'
    - '@group(wxt-assets)'
    outputs:
    - '@group(wxt-extension-dist)'
  wxt-sign-firefox:
    toolchain: node
    preset: utility
    options:
      runDepsInParallel: false
    deps:
    - wxt-build-firefox
    script: $workspaceRoot/etc/scripts/moon-tasks/wxt-sign-firefox.ts
    env:
      PROJECT_ROOT: $projectRoot
    inputs:
    - '@group(wxt-config)'
    - '@group(wxt-sources)'
    - '@group(wxt-assets)'
inheritedBy:
  tag: wxt
